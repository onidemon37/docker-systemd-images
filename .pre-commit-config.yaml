---
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - { id: check-case-conflict }
      - { id: check-merge-conflict }
      - { id: check-symlinks }
      - { id: check-json }
      - { id: check-yaml }
      - { id: detect-private-key }
      - { id: end-of-file-fixer }
      - { id: trailing-whitespace }
      - { id: check-added-large-files }
      - { id: mixed-line-ending }

  # Note: Hadolint is run via 'make lint' instead of pre-commit due to Docker dependency
  # Uncomment the following if you have hadolint installed locally:
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.12.0
  #   hooks:
  #     - id: hadolint
  #       args: ['--ignore', 'DL3041', '--ignore', 'DL3008', '--ignore', 'DL3013', '--ignore', 'DL3003', '--ignore', 'DL3047']

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: relaxed, rules: {line-length: {max: 120}}}']

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.json']

  # Shell script linting (for any shell scripts)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
