---
name: Build and Push SystemD Images

on:
  push:
    branches: [main]
    paths:
      - 'oraclelinux/**'
      - 'debian/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      os_family:
        description: 'OS Family to build (all, oraclelinux, debian)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-oracle:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.os_family == 'all' ||
      github.event.inputs.os_family == 'oraclelinux'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [8, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./oraclelinux/${{ matrix.version }}
          file: ./oraclelinux/${{ matrix.version }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/oraclelinux:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/oraclelinux:${{ matrix.version }}-${{ env.short_sha }}



  build-debian:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.os_family == 'all' ||
      github.event.inputs.os_family == 'debian'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [10, 11, 12, 13]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./debian/${{ matrix.version }}
          file: ./debian/${{ matrix.version }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/debian-:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/debian:${{ matrix.version }}-${{ env.short_sha }}
          cache-from: type=gha,scope=debian-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=debian-${{ matrix.version }}
