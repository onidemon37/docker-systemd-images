---
name: Build and Push SystemD Images

on:
  push:
    branches: [main]
    paths:
      - 'oraclelinux/**'
      - 'debian/**'
      - 'fedora/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      os_family:
        description: 'OS Family to build (all, oraclelinux, debian, fedora)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      oraclelinux: ${{ steps.changes.outputs.oraclelinux }}
      debian: ${{ steps.changes.outputs.debian }}
      fedora: ${{ steps.changes.outputs.fedora }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: changes
        with:
          filters: |
            oraclelinux:
              - 'oraclelinux/**'
            debian:
              - 'debian/**'
            fedora:
              - 'fedora/**'

  build-oracle:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.os_family == 'all' ||
        github.event.inputs.os_family == 'oraclelinux'
      ) ||
      (github.event_name != 'workflow_dispatch' && needs.detect-changes.outputs.oraclelinux == 'true')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [8, 9, 10]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./oraclelinux/${{ matrix.version }}
          file: ./oraclelinux/${{ matrix.version }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/oraclelinux:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/oraclelinux:${{ matrix.version }}-${{ env.short_sha }}



  build-debian:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.os_family == 'all' ||
        github.event.inputs.os_family == 'debian'
      ) ||
      (github.event_name != 'workflow_dispatch' && needs.detect-changes.outputs.debian == 'true')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [10, 11, 12, 13]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./debian/${{ matrix.version }}
          file: ./debian/${{ matrix.version }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/debian:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/debian:${{ matrix.version }}-${{ env.short_sha }}
          cache-from: type=gha,scope=debian-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=debian-${{ matrix.version }}

  build-fedora:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.os_family == 'all' ||
        github.event.inputs.os_family == 'fedora'
      ) ||
      (github.event_name != 'workflow_dispatch' && needs.detect-changes.outputs.fedora == 'true')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [41, 42, 43]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./fedora/${{ matrix.version }}
          file: ./fedora/${{ matrix.version }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fedora:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fedora:${{ matrix.version }}-${{ env.short_sha }}
          cache-from: type=gha,scope=fedora-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=fedora-${{ matrix.version }}
