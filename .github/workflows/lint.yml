name: Code Quality & Linting

# Triggers this workflow on push and pull request events to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_validate:
    name: Lint & Validate Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint Markdown (Markdownlint)
        uses: avto-dev/markdown-lint@04d43ee9191307b50935a753da3b775ab695eceb # v1.5.0
        with:
          # Checks all Markdown files (.md) recursively
          files: '**/*.md'

      - name: Lint Dockerfiles (Hadolint)
        uses: reviewdog/action-hadolint@fc7ee4a9f71e521bc43e370819247b70e5327540 # v1.50.2
        with:
          # Targets all Dockerfiles in the project structure
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: file
          hadolint_flags: "--no-color --ignore DL3041 --ignore DL3008 --ignore DL3013 --ignore DL3003 --ignore DL3047 --ignore SC2086"
          path: .

      - name: Validate GitHub Actions Workflow (Actionlint)
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: file
          actionlint_flags: "-shellcheck"
          path: .github/workflows/
