name: Code Quality & Linting

# Triggers this workflow on push and pull request events to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_validate:
    name: Lint & Validate Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Lint Markdown (Markdownlint)
        uses: avto-dev/markdown-lint@v1.5.0
        with:
          # Checks all Markdown files (.md) recursively
          files: '**/*.md'

      - name: Lint Dockerfiles (Hadolint)
        uses: reviewdog/action-hadolint@v1.50.2
        with:
          # Targets all Dockerfiles in the project structure
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          filter_mode: file
          hadolint_flags: "--no-color"
          path: .

      - name: Validate GitHub Actions Workflow (Actionlint)
        uses: reviewdog/action-actionlint@v1.68.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          filter_mode: file
          actionlint_flags: "-shellcheck"
          path: .github/workflows/
